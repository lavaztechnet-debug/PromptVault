<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lava's Expanded Prompt Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg:#1a1a1a; 
      --bg-2:#252525; 
      --bg-3:#2f2f2f;
      --text:#e8e8e8; 
      --muted:#a0a0a0; 
      --glow-cyan:#59f0ff;
      --shadow-dark: 0 8px 16px rgba(0,0,0,0.8), 0 4px 8px rgba(0,0,0,0.6);
      --shadow-light: 0 2px 4px rgba(255,255,255,0.1);
      --shadow-inset: inset 0 2px 6px rgba(0,0,0,0.7), inset 0 -2px 6px rgba(255,255,255,0.08);
    }
    
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    
    body { 
      margin: 0; 
      min-height: 100vh; 
      font-family: 'Outfit', sans-serif; 
      background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 50%, #1a1a1a 100%); 
      color: var(--text); 
      padding: 0;
      overflow-x: hidden;
    }

    /* Enhanced Neumorphic Styles with 3D Depth */
    .neo-container {
      background: linear-gradient(145deg, #353535, #1f1f1f);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 
        0 20px 40px rgba(0,0,0,0.9),
        0 10px 20px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.1),
        inset 0 -1px 0 rgba(0,0,0,0.8);
      border-radius: 24px;
      padding: 24px;
      position: relative;
    }

    .neo-container::before {
      content: '';
      position: absolute;
      inset: 1px;
      border-radius: 23px;
      background: linear-gradient(145deg, rgba(255,255,255,0.02) 0%, transparent 50%);
      pointer-events: none;
    }

    .neo-btn {
      background: linear-gradient(145deg, #3a3a3a, #242424);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 
        0 12px 24px rgba(0,0,0,0.8),
        0 6px 12px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.15),
        inset 0 -1px 0 rgba(0,0,0,0.7);
      border-radius: 18px;
      padding: 14px 20px;
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .neo-btn::before {
      content: '';
      position: absolute;
      inset: 1px;
      border-radius: 17px;
      background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    .neo-btn:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 16px 32px rgba(0,0,0,0.9),
        0 8px 16px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.2),
        inset 0 -1px 0 rgba(0,0,0,0.8);
    }

    .neo-btn:active {
      transform: translateY(1px);
      box-shadow: 
        0 8px 16px rgba(0,0,0,0.8),
        0 4px 8px rgba(0,0,0,0.6),
        inset 0 2px 4px rgba(0,0,0,0.7);
    }

    .neo-btn.primary {
      background: linear-gradient(145deg, #1a5f7a, #0d3a4d);
      border: 1px solid rgba(89, 240, 255, 0.3);
      box-shadow: 
        0 12px 24px rgba(0,0,0,0.8),
        0 6px 12px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(89, 240, 255, 0.2),
        inset 0 -1px 0 rgba(0,0,0,0.7);
    }

    .neo-btn.primary:hover {
      box-shadow: 
        0 16px 32px rgba(89, 240, 255, 0.3),
        0 8px 16px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(89, 240, 255, 0.3);
    }

    .neo-inset {
      background: linear-gradient(145deg, #1a1a1a, #141414);
      border: 1px solid rgba(0,0,0,0.6);
      box-shadow: 
        inset 0 4px 12px rgba(0,0,0,0.8),
        inset 0 -2px 4px rgba(255,255,255,0.08),
        0 2px 4px rgba(0,0,0,0.6);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .neo-inset:focus {
      outline: none;
      border-color: rgba(89, 240, 255, 0.4);
      box-shadow: 
        inset 0 4px 12px rgba(0,0,0,0.8),
        inset 0 -2px 4px rgba(255,255,255,0.1),
        0 0 16px rgba(89, 240, 255, 0.2);
    }

    .prompt-card {
      background: linear-gradient(135deg, #2d2d2d, #222222);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 
        0 16px 32px rgba(0,0,0,0.85),
        0 8px 16px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      transition: all 0.3s ease;
      transform: translateZ(0);
    }

    .prompt-card::before {
      content: '';
      position: absolute;
      inset: 1px;
      border-radius: 19px;
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 50%);
      pointer-events: none;
    }

    .prompt-card:active {
      transform: scale(0.98);
      box-shadow: 
        0 12px 24px rgba(0,0,0,0.85),
        0 6px 12px rgba(0,0,0,0.6),
        inset 0 2px 4px rgba(0,0,0,0.7);
    }

    .prompt-card h3 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      margin: 0;
      word-break: break-word;
    }

    .prompt-card p {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    #toast {
      visibility: hidden;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(145deg, #3a3a3a, #242424);
      border: 1px solid rgba(89, 240, 255, 0.4);
      color: var(--glow-cyan);
      padding: 14px 28px;
      border-radius: 28px;
      z-index: 1000;
      font-weight: 600;
      box-shadow: 
        0 12px 32px rgba(89, 240, 255, 0.3),
        0 6px 16px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(89, 240, 255, 0.2);
      animation: toastSlide 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #toast.show {
      visibility: visible;
    }

    @keyframes toastSlide {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    header {
      padding: 12px 0;
      margin-bottom: 8px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 900;
      margin: 0 0 12px 0;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 0%, #a0a0a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .button-group .neo-btn {
      flex: 1;
      min-width: 100px;
      font-size: 0.85rem;
      padding: 12px 14px;
    }

    /* Portrait Mode (Mobile Default) */
    @media (max-width: 768px) and (orientation: portrait) {
      body {
        padding-bottom: 20px;
      }

      .max-w-2xl {
        max-width: 100%;
        margin: 0 auto;
        padding: 12px;
      }

      header {
        padding: 16px 0 8px 0;
      }

      header h1 {
        font-size: 1.75rem;
        margin-bottom: 16px;
      }

      .neo-container {
        padding: 18px;
        margin-bottom: 16px;
        border-radius: 20px;
      }

      .neo-container h2 {
        font-size: 1.3rem;
        margin: 0 0 12px 0;
      }

      .neo-inset {
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 12px;
        font-size: 0.9rem;
      }

      textarea.neo-inset {
        min-height: 100px;
        resize: vertical;
        max-height: 180px;
      }

      #searchInput {
        margin-bottom: 16px;
      }

      #promptGrid {
        gap: 12px;
      }

      .prompt-card {
        padding: 16px;
        border-radius: 18px;
        gap: 10px;
      }

      .prompt-card h3 {
        font-size: 1.05rem;
      }

      .prompt-card p {
        font-size: 0.8rem;
        -webkit-line-clamp: 2;
      }

      .button-group {
        gap: 8px;
      }

      .button-group .neo-btn {
        font-size: 0.8rem;
        padding: 10px 12px;
        min-width: auto;
      }
    }

    /* Landscape Mode */
    @media (max-width: 1024px) and (orientation: landscape) {
      body {
        padding-bottom: 12px;
      }

      .max-w-2xl {
        max-width: 100%;
        padding: 10px;
      }

      header {
        padding: 8px 0;
        margin-bottom: 4px;
      }

      header h1 {
        font-size: 1.5rem;
        margin-bottom: 8px;
      }

      .button-group {
        gap: 6px;
        margin-bottom: 12px;
      }

      .button-group .neo-btn {
        font-size: 0.75rem;
        padding: 10px 12px;
        min-width: 70px;
      }

      .neo-container {
        padding: 12px;
        margin-bottom: 12px;
      }

      .neo-container h2 {
        font-size: 1.1rem;
        margin-bottom: 8px;
      }

      textarea.neo-inset {
        min-height: 70px;
        max-height: 120px;
        font-size: 0.85rem;
      }

      #searchInput {
        margin-bottom: 12px;
        font-size: 0.9rem;
      }

      #promptGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 12px;
      }

      .prompt-card {
        padding: 14px;
        gap: 8px;
      }

      .prompt-card h3 {
        font-size: 1rem;
      }

      .prompt-card p {
        font-size: 0.75rem;
        -webkit-line-clamp: 2;
      }

      .button-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
    }

    /* Tablet/Larger screens */
    @media (min-width: 769px) {
      .max-w-2xl {
        max-width: 900px;
        padding: 0 16px;
      }

      header h1 {
        font-size: 2.25rem;
      }

      #promptGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }

      .button-group .neo-btn {
        font-size: 0.9rem;
        padding: 12px 18px;
      }
    }

    /* Prevent layout shift on scroll */
    html {
      overflow-y: scroll;
    }

    /* Smooth scrolling */
    * {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body>
  <div id="toast">Copied to Clipboard!</div>
  
  <div class="max-w-2xl mx-auto">
    <header class="text-center">
      <h1>🔮 Lava's Prompt Vault</h1>
      <div class="button-group">
        <button onclick="copyAll()" class="neo-btn">📋 Copy All</button>
        <button onclick="exportGoogleDocs()" class="neo-btn">💙 Docs</button>
        <button onclick="exportSamsungNotes()" class="neo-btn">🧡 Notes</button>
        <button onclick="window.print()" class="neo-btn">🖨️ Print</button>
      </div>
    </header>

    <div class="neo-container">
      <h2>🚀 AI Sandbox</h2>
      <textarea id="aiSandboxBox" class="neo-inset" placeholder="Paste or create your prompts here..."></textarea>
      <div class="button-group">
        <button onclick="launchGeminiApp()" class="neo-btn primary flex-1">🌌 Launch Gemini</button>
        <button onclick="document.getElementById('aiSandboxBox').value=''" class="neo-btn flex-1">Clear</button>
      </div>
    </div>

    <input type="text" id="searchInput" class="neo-inset" placeholder="🔍 Search prompts...">
    
    <div id="promptGrid" class="grid grid-cols-1 gap-4"></div>
  </div>

  <script>
    const prompts = [
      { id: 1, category: 'app', title: 'Offline-First Note App', prompt: "Build a complete offline-first note app with robust search capabilities, tagging, seamless cloud synchronization, and flexible storage options. Include real-time sync, conflict resolution, and end-to-end encryption." },
      { id: 2, category: 'app', title: 'Premium Podcast Player', prompt: "Create a premium podcast player featuring advanced playlist management, an intelligent sleep timer, precise chapter markers, variable playback speeds, and queue management. Include downloading for offline listening." },
      { id: 3, category: 'app', title: 'Horror Story Reader', prompt: "Design an immersive horror story reader app with chilling audio narration, atmospheric visual effects (e.g., subtle parallax, dynamic shadows), and interactive story branching with multiple endings." },
      { id: 4, category: 'app', title: 'Secure Password Vault', prompt: "Build a highly secure password vault app incorporating biometric authentication (fingerprint/face ID), military-grade encryption, password generation, and secure sharing with expiration options." },
      { id: 5, category: 'app', title: 'Habit Tracker Pro', prompt: "Create a professional habit tracker with advanced streak tracking, customizable reminders, detailed analytics and progress visualization, habit linking, and motivation notifications." },
      { id: 6, category: 'app', title: 'Media Planner', prompt: "Build a comprehensive media planner app for content creators, including scriptwriting tools, storyboard creation, publishing calendars, asset management, and collaboration features." },
      { id: 7, category: 'app', title: 'Expense Tracker', prompt: "Create a fully operational expense tracker with OCR receipt scanning, intelligent categorization, detailed charts and financial reports, budget monitoring, and multi-currency support." },
      { id: 8, category: 'app', title: 'Book Catalog', prompt: "Build a smart book catalog app with ISBN barcode scanning, automatic metadata retrieval (author, genre, publication date), personalized recommendations, and reading progress tracking." },
      { id: 9, category: 'app', title: 'Recipe Manager', prompt: "Create a versatile recipe manager with integrated shopping list generation, robust offline support, a nutritional calculator, photo OCR for recipes, and meal planning capabilities." },
      { id: 10, category: 'app', title: 'Fitness Log', prompt: "Build a comprehensive fitness log app with customizable workout templates, interactive progress graphs, personal record (PR) tracking, and AI-powered form correction using device camera." },
      { id: 11, category: 'android', title: 'Clean Architecture Refactor', prompt: "Refactor an existing Android application into a modern clean architecture using Jetpack Compose for UI, Hilt for dependency injection, and proper separation of concerns." },
      { id: 12, category: 'android', title: 'Fragment to Compose Migration', prompt: "Transform a legacy fragment-based Android application into a modern, declarative Jetpack Compose application, ensuring all features are preserved and tests are updated." },
      { id: 13, category: 'android', title: 'Offline Caching & Retry Logic', prompt: "Implement comprehensive offline caching and resilient retry logic within the Android repository layer, ensuring data consistency and graceful degradation." },
      { id: 14, category: 'android', title: 'Room Schema Definition', prompt: "Write a complete Room database schema for an application's data model, including detailed Entity definitions, Data Access Objects (DAOs), and migration strategies." },
      { id: 15, category: 'android', title: 'ViewModels for All Screens', prompt: "Generate robust ViewModels for all application screens, incorporating loading, empty, and error states, along with appropriate data handling and lifecycle management." },
      { id: 16, category: 'android', title: 'Navigation Flows', prompt: "Create comprehensive navigation flows for key user journeys such as onboarding, dashboard, detail views, and settings. Utilize Jetpack Navigation with type-safe arguments." },
      { id: 17, category: 'android', title: 'Dark Mode & Accessibility', prompt: "Add full dark mode support, enhance accessibility features (e.g., content descriptions, touch target sizes), and implement proper contrast ratios for WCAG compliance." },
      { id: 18, category: 'android', title: 'File Import/Export & Share', prompt: "Implement secure and user-friendly file import/export functionalities and share intents using Scoped Storage and Storage Access Framework (SAF)." },
      { id: 19, category: 'android', title: 'Background Sync with WorkManager', prompt: "Add reliable background data synchronization using WorkManager, implementing battery-friendly scheduling, network-aware retries, and proper error handling." },
      { id: 20, category: 'android', title: 'App Hardening & Security', prompt: "Harden an Android application against common vulnerabilities by implementing input sanitization, secure storage practices, certificate pinning, and obfuscation." },
      { id: 21, category: 'prompt', title: 'Production Gemini Prompt', prompt: "Rewrite this high-level idea into a production-grade Gemini prompt. The prompt should be highly specific, structured with clear sections, and include examples." },
      { id: 22, category: 'prompt', title: 'One-line to Build Spec', prompt: "Expand this one-line application concept into a complete build specification document. Include detailed sections on features, architecture, tech stack, and deployment." },
      { id: 23, category: 'prompt', title: 'Features to Tasks', prompt: "Convert a given feature list into a detailed breakdown of implementation tasks, including estimated effort, dependencies, and acceptance criteria." },
      { id: 24, category: 'prompt', title: 'Force Complete Code', prompt: "Generate a developer prompt that explicitly forces the AI to produce complete, runnable, and non-placeholder code for all requirements without shortcuts." },
      { id: 25, category: 'prompt', title: 'Senior Android Architect', prompt: "Create a prompt making Gemini act as a senior Android architect. The AI should provide expert advice on architecture decisions and best practices." },
      { id: 26, category: 'prompt', title: 'Modular Testing', prompt: "Build a prompt asking for a modular architecture approach with a strong emphasis on testing. The AI should generate code with unit and integration tests." },
      { id: 27, category: 'prompt', title: 'Rough Idea to Product', prompt: "Transform a rough product idea into a deployment-ready product prompt. This includes defining target users, core functionality, and success metrics." },
      { id: 28, category: 'prompt', title: 'No Root App Prompt', prompt: "Create a prompt for building an Android application that operates without requiring root access, avoids hidden dependencies, and is suitable for distribution." },
      { id: 29, category: 'prompt', title: 'Full Stack Prompt', prompt: "Write a comprehensive prompt generating a full-stack solution, encompassing UI design (frontend), business logic (backend), and database schema." },
      { id: 30, category: 'prompt', title: 'Code Repair Prompt', prompt: "Create a prompt making Gemini act as a code repair and improvement agent. The AI should identify bugs, suggest fixes, refactor code, and improve performance." }
    ];
    
    function renderPrompts() {
      const grid = document.getElementById('promptGrid');
      grid.innerHTML = '';
      const searchInput = document.getElementById('searchInput').value.toLowerCase();

      const filteredPrompts = prompts.filter(p => 
        p.title.toLowerCase().includes(searchInput) || 
        p.prompt.toLowerCase().includes(searchInput) ||
        p.category.toLowerCase().includes(searchInput)
      );

      filteredPrompts.forEach(p => {
        const card = document.createElement('div');
        card.className = 'prompt-card';
        card.innerHTML = `
          <h3>${p.title}</h3>
          <p>${p.prompt}</p>
          <div class="button-group">
            <button onclick="copyPrompt('${p.prompt.replace(/\'/g, "\\'")}')" class="neo-btn" style="flex:1">Copy</button>
            <button onclick="sendToSandbox('${p.prompt.replace(/\'/g, "\\'")}')" class="neo-btn" style="flex:1">Sandbox</button>
          </div>`;
        grid.appendChild(card);
      });
    }

    function copyPrompt(text) {
      navigator.clipboard.writeText(text);
      showToast('Prompt Copied!');
    }

    function sendToSandbox(text) {
      document.getElementById('aiSandboxBox').value = text;
      showToast('Sent to Sandbox!');
    }

    function launchGeminiApp() { 
      const text = document.getElementById('aiSandboxBox').value; 
      if(text) {
        const encodedText = encodeURIComponent(text);
        window.location.href = `intent://send?text=${encodedText}#Intent;action=android.intent.action.SEND;type=text/plain;package=com.google.android.apps.bard;end`; 
      }
    }
    
    function copyAll() { 
      navigator.clipboard.writeText(prompts.map(p => p.prompt).join('\n\n')); 
      showToast('All Prompts Copied!');
    }

    function showToast(message) {
      const t = document.getElementById('toast'); 
      t.innerText = message; 
      t.classList.add('show'); 
      setTimeout(() => t.classList.remove('show'), 2000); 
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderPrompts();
      document.getElementById('searchInput').addEventListener('keyup', renderPrompts);
    });

    function exportGoogleDocs() {
      alert('Export to Google Docs functionality coming soon!');
    }

    function exportSamsungNotes() {
      alert('Export to Samsung Notes functionality coming soon!');
    }
  </script>
</body>
</html>
