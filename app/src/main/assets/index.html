<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lava's Expanded Prompt Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#2f2f2f; --bg-2:#262626; --text:#d9d9d9; --muted:#9a9a9a; --glow-cyan:#59f0ff; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0; min-height:100vh; font-family:'Outfit',sans-serif; background:linear-gradient(180deg,#2f2f2f 0%, #252525 60%, #1f1f1f 100%); color:var(--text); padding-bottom: 2rem; }
    .neo-flat { background:linear-gradient(145deg,#414141,#2e2e2e); border:1px solid rgba(0,0,0,.7); box-shadow:0 4px 8px rgba(0,0,0,.55); border-radius:18px; padding: 20px; }
    .neo-btn { background:linear-gradient(145deg,#414141,#2e2e2e); border:1px solid rgba(0,0,0,.7); box-shadow:0 4px 8px rgba(0,0,0,.55); border-radius:14px; padding: 10px 16px; color:white; font-weight:bold; cursor:pointer; font-size: 0.85rem; }
    .neo-btn:active { transform: scale(0.97); }
    .neo-inset { background:#232323; border:1px solid #111; box-shadow:inset 0 2px 4px rgba(0,0,0,0.5); border-radius:12px; padding: 12px; width: 100%; color: white; }
    .prompt-card { background:#333; border-radius:16px; padding: 16px; display:flex; flex-direction:column; border: 1px solid #444; }
    #toast { visibility:hidden; position:fixed; bottom:50px; left:50%; transform:translateX(-50%); background:#333; color:#59f0ff; padding:12px 24px; border-radius:25px; z-index:1000; font-weight: bold; border: 1px solid #59f0ff; }
    #toast.show { visibility:visible; }

    /* Mobile-specific adjustments */
    @media (max-width: 768px) {
      .max-w-2xl { max-width: 100%; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .neo-btn { font-size: 0.95rem; padding: 12px 18px; }
      .prompt-card { padding: 12px; }
      .prompt-card h3 { font-size: 1.1rem; }
      .prompt-card p { font-size: 0.9rem; }
      .flex-wrap { flex-wrap: wrap; }
      .gap-2 { gap: 0.5rem; }
    }
  </style>
</head>
<body>
  <div id="toast">Copied to Clipboard!</div>
  <div class="max-w-2xl mx-auto px-4">
    <header class="text-center my-6">
      <h1 class="text-3xl font-black mb-4 text-white tracking-tight">Lava's Prompt Vault</h1>
      <div class="flex flex-wrap gap-2 justify-center">
        <button onclick="copyAll()" class="neo-btn">📋 Copy All</button>
        <button onclick="exportGoogleDocs()" class="neo-btn">💙 Docs</button>
        <button onclick="exportSamsungNotes()" class="neo-btn">🧡 Notes</button>
        <button onclick="window.print()" class="neo-btn">🖨️ Print</button>
      </div>
    </header>

    <div class="neo-flat mb-6">
      <h2 class="text-xl font-bold mb-3 text-white">🚀 AI Sandbox</h2>
      <textarea id="aiSandboxBox" rows="4" class="neo-inset mb-3"></textarea>
      <div class="flex gap-2">
        <button onclick="launchGeminiApp()" class="neo-btn bg-cyan-900 flex-1">🌌 Launch Gemini</button>
        <button onclick="document.getElementById('aiSandboxBox').value=''" class="neo-btn flex-1">Clear</button>
      </div>
    </div>

    <input type="text" id="searchInput" placeholder="🔍 Search prompts..." class="neo-inset mb-6">
    <div id="promptGrid" class="grid grid-cols-1 gap-4"></div>
  </div>

  <script>
    const prompts = [
      { id: 1, category: 'app', title: 'Offline-First Note App', prompt: "Build a complete offline-first note app with robust search capabilities, tagging, seamless cloud synchronization, and flexible export options (e.g., PDF, Markdown). Focus on a minimalist UI and efficient local data storage.", icon: '📝' },
      { id: 2, category: 'app', title: 'Premium Podcast Player', prompt: "Create a premium podcast player featuring advanced playlist management, an intelligent sleep timer, precise chapter markers, variable playback speeds, and car mode integration. Emphasize intuitive UX and high-fidelity audio.", icon: '🎙️' },
      { id: 3, category: 'app', title: 'Horror Story Reader', prompt: "Design an immersive horror story reader app with chilling audio narration, atmospheric visual effects (e.g., subtle parallax, dynamic lighting), a customizable night mode, and a curated library of public domain horror fiction.", icon: '👻' },
      { id: 4, category: 'app', title: 'Secure Password Vault', prompt: "Build a highly secure password vault app incorporating biometric authentication (fingerprint/face ID), military-grade encrypted local storage, and integrated Time-based One-Time Password (TOTP) generation. Prioritize user privacy and data integrity.", icon: '🔒' },
      { id: 5, category: 'app', title: 'Habit Tracker Pro', prompt: "Create a professional habit tracker with advanced streak tracking, customizable reminders, detailed analytics and progress visualizations, interactive widgets, and cross-device synchronization (e.g., iCloud equivalent). Focus on motivation and long-term adherence.", icon: '📈' },
      { id: 6, category: 'app', title: 'Media Planner', prompt: "Build a comprehensive media planner app for content creators, including scriptwriting tools, storyboard creation, publishing calendars with scheduling, and an asset tracker for images, videos, and audio files. Integrate collaboration features.", icon: '🎬' },
      { id: 7, category: 'app', title: 'Expense Tracker', prompt: "Create a fully operational expense tracker with OCR receipt scanning, intelligent categorization, detailed charts and financial reports, management of recurring expenses, and secure data export options (e.g., CSV, QIF).", icon: '💰' },
      { id: 8, category: 'app', title: 'Book Catalog', prompt: "Build a smart book catalog app with ISBN barcode scanning, automatic metadata retrieval (author, genre, publication date), personalized recommendations, reading progress tracking, and a wishlist feature.", icon: '📚' },
      { id: 9, category: 'app', title: 'Recipe Manager', prompt: "Create a versatile recipe manager with integrated shopping list generation, robust offline support, a nutritional calculator, photo OCR for recipe import, and meal planning functionalities. Focus on ease of use for home cooks.", icon: '🍳' },
      { id: 10, category: 'app', title: 'Fitness Log', prompt: "Build a comprehensive fitness log app with customizable workout templates, interactive progress graphs, personal record (PR) tracking, an adjustable rest timer, and integration with wearable devices for heart rate monitoring.", icon: '🏋️' },
      { id: 11, category: 'android', title: 'Clean Architecture Refactor', prompt: "Refactor an existing Android application into a modern clean architecture using Jetpack Compose for UI, Hilt for dependency injection, Room for local persistence, a robust Repository pattern, and well-defined UseCases for business logic.", icon: '🔄' },
      { id: 12, category: 'android', title: 'Fragment to Compose Migration', prompt: "Transform a legacy fragment-based Android application into a modern, declarative Jetpack Compose application, ensuring smooth transitions, state management, and adherence to Compose best practices.", icon: '⚡' },
      { id: 13, category: 'android', title: 'Offline Caching & Retry Logic', prompt: "Implement comprehensive offline caching and resilient retry logic within the Android repository layer, ensuring data availability and smooth user experience even with intermittent network connectivity.", icon: '💾' },
      { id: 14, category: 'android', title: 'Room Schema Definition', prompt: "Write a complete Room database schema for an application's data model, including detailed Entity definitions, Data Access Objects (DAOs) with various query methods, and the main Database class with migrations.", icon: '🗄️' },
      { id: 15, category: 'android', title: 'ViewModels for All Screens', prompt: "Generate robust ViewModels for all application screens, incorporating loading, empty, and error states, along with appropriate retry logic and data observation patterns (e.g., Kotlin Flows, LiveData).", icon: '🎛️' },
      { id: 16, category: 'android', title: 'Navigation Flows', prompt: "Create comprehensive navigation flows for key user journeys such as onboarding, dashboard, detail views, and settings. Utilize both NavGraph XML and Jetpack Compose Navigation for a flexible and scalable solution.", icon: '🗺️' },
      { id: 17, category: 'android', title: 'Dark Mode & Accessibility', prompt: "Add full dark mode support, enhance accessibility features (e.g., content descriptions, touch target sizes), and implement responsive layouts to an existing Android application, ensuring an inclusive user experience.", icon: '🌙' },
      { id: 18, category: 'android', title: 'File Import/Export & Share', prompt: "Implement secure and user-friendly file import/export functionalities and share intents using Scoped Storage and Storage Access Framework (SAF) in Android, adhering to modern privacy guidelines.", icon: '📤' },
      { id: 19, category: 'android', title: 'Background Sync with WorkManager', prompt: "Add reliable background data synchronization using WorkManager, implementing battery-friendly scheduling, network constraints, and exponential backoff strategies for efficient and persistent data updates.", icon: '🔄' },
      { id: 20, category: 'android', title: 'App Hardening & Security', prompt: "Harden an Android application against common vulnerabilities by implementing input sanitization, secure storage practices, crash prevention mechanisms, and obfuscation techniques. Focus on robust security.", icon: '🛡️' },
      { id: 21, category: 'prompt', title: 'Production Gemini Prompt', prompt: "Rewrite this high-level idea into a production-grade Gemini prompt. The prompt should be highly specific, structured with clear roles, context, constraints, and output format, ensuring consistent and high-quality AI responses.", icon: '✨' },
      { id: 22, category: 'prompt', title: 'One-line to Build Spec', prompt: "Expand this one-line application concept into a complete build specification document. Include detailed sections on features, technical requirements, architecture overview, technology stack, and deployment considerations.", icon: '📐' },
      { id: 23, category: 'prompt', title: 'Features to Tasks', prompt: "Convert a given feature list into a detailed breakdown of implementation tasks, including estimated effort, dependencies, and a suggested file structure for the project. Categorize tasks by frontend, backend, and database.", icon: '🧩' },
      { id: 24, category: 'prompt', title: 'Force Complete Code', prompt: "Generate a developer prompt that explicitly forces the AI to produce complete, runnable, and non-placeholder code for all requested components, including imports, boilerplate, and example usage. Emphasize no omissions.", icon: '🧱' },
      { id: 25, category: 'prompt', title: 'Senior Android Architect', prompt: "Create a prompt making Gemini act as a senior Android architect. The AI should provide expert advice on architecture decisions, performance optimizations, scalability, and best practices for complex Android projects.", icon: '🏗️' },
      { id: 26, category: 'prompt', title: 'Modular Testing', prompt: "Build a prompt asking for a modular architecture approach with a strong emphasis on testing. The AI should generate code with unit, integration, and UI tests, promoting testability and maintainability.", icon: '🧪' },
      { id: 27, category: 'prompt', title: 'Rough Idea to Product', prompt: "Transform a rough product idea into a deployment-ready product prompt. This includes defining target users, core functionalities, monetization strategies, and a phased development roadmap.", icon: '🚀' },
      { id: 28, category: 'prompt', title: 'No Root App Prompt', prompt: "Create a prompt for building an Android application that operates without requiring root access, avoids hidden dependencies, and adheres strictly to official Android APIs and security guidelines.", icon: '📱' },
      { id: 29, category: 'prompt', title: 'Full Stack Prompt', prompt: "Write a comprehensive prompt generating a full-stack solution, encompassing UI design (frontend), business logic (backend), state management, data persistence, and API integration, ensuring all layers work cohesively.", icon: '🔧' },
      { id: 30, category: 'prompt', title: 'Code Repair Prompt', prompt: "Create a prompt making Gemini act as a code repair and improvement agent. The AI should identify bugs, suggest fixes, refactor code for readability and performance, and enhance the overall user experience.", icon: '🛠️' },
      { id: 31, category: 'document', title: 'Project Brief', prompt: "Write a polished project brief for this application. Include an executive summary, a clear problem statement, proposed solution, target audience, key features, and success metrics. Aim for conciseness and clarity.", icon: '📄' },
      { id: 32, category: 'document', title: 'PRD Document', prompt: "Turn a product idea into a comprehensive Product Requirements Document (PRD). Detail user stories, acceptance criteria, functional and non-functional requirements, and a high-level scope. Structure for clarity and stakeholder alignment.", icon: '📋' },
      { id: 33, category: 'document', title: 'Technical Spec', prompt: "Create a detailed technical specification for an entire Android application. Include an architecture diagram, component breakdown, API contracts, data models, and implementation details for key modules.", icon: '🧭' },
      { id: 34, category: 'document', title: 'Release Notes v1.0', prompt: "Write professional release notes for version 1.0 of an application. Highlight new features, significant improvements, critical bug fixes, and known issues. Tailor for both technical and non-technical audiences.", icon: '📝' },
      { id: 35, category: 'document', title: 'README Generator', prompt: "Generate a comprehensive README.md file for a software project. Include sections for setup instructions, features, usage examples, contribution guidelines, license information, and badges (e.g., build status, version).", icon: '📘' },
      { id: 36, category: 'document', title: 'Privacy Policy', prompt: "Create a draft privacy policy for a consumer Android application. Address data collection practices, storage, usage, sharing with third parties, user rights, and compliance with relevant regulations (e.g., GDPR, CCPA).", icon: '🔐' },
      { id: 37, category: 'document', title: 'Terms of Service', prompt: "Write terms of service for a mobile productivity app. Cover acceptable use, intellectual property, disclaimers, limitation of liability, termination clauses, and dispute resolution mechanisms.", icon: '📜' },
      { id: 38, category: 'document', title: 'Support FAQ', prompt: "Create a comprehensive support FAQ for an application. Organize by common issues, troubleshooting steps, account management, payment queries, and general usage questions. Provide clear and concise answers.", icon: '❓' },
      { id: 39, category: 'document', title: 'Changelog Template', prompt: "Write a flexible changelog template for future application updates. Structure it to follow semantic versioning (MAJOR.MINOR.PATCH) and include sections for 'Added', 'Changed', 'Deprecated', 'Removed', 'Fixed', and 'Security'.", icon: '🗂️' },
      { id: 40, category: 'document', title: 'Investor Summary', prompt: "Draft a concise one-page investor summary for a mobile product. Articulate the problem being solved, the unique solution, market opportunity, business model, team, and key financial projections. Aim for high impact.", icon: '💼' },
      { id: 41, category: 'tool', title: 'Test Case Generator', prompt: "Build a prompt that generates detailed test cases from application requirements or user stories. Include test steps, expected results, preconditions, and postconditions for various scenarios (positive, negative, edge cases).", icon: '✅' },
      { id: 42, category: 'tool', title: 'Code Audit Prompt', prompt: "Create a prompt for auditing code for potential bugs, missing features, security vulnerabilities, performance bottlenecks, and adherence to coding standards. The AI should provide actionable recommendations.", icon: '🔍' },
      { id: 43, category: 'tool', title: 'UI Refactor Prompt', prompt: "Generate a prompt for refactoring an existing UI into reusable, modular components. Focus on identifying common patterns, creating a component library, and improving maintainability and scalability of the frontend.", icon: '🪛' },
      { id: 44, category: 'tool', title: 'Web to PWA Prompt', prompt: "Write a prompt for transforming a standard web application into an Android-friendly Progressive Web App (PWA). Include steps for manifest creation, service worker implementation, and offline capabilities.", icon: '🌐' },
      { id: 45, category: 'tool', title: 'Analytics Integration Prompt', prompt: "Build a prompt for cleanly integrating analytics and event tracking into an application. Specify desired events, parameters, and a strategy for privacy-compliant data collection and reporting.", icon: '📊' },
      { id: 46, category: 'tool', title: 'Onboarding Flow Generator', prompt: "Create a prompt that generates engaging onboarding screens and UX copy for a new application. Focus on guiding users through initial setup, highlighting key features, and reducing friction.", icon: '👋' },
      { id: 47, category: 'tool', title: 'API Integration Code', prompt: "Write a prompt producing robust API integration code with built-in error handling, retry mechanisms, authentication (e.g., OAuth2), and data serialization/deserialization for a specified external API.", icon: '🔌' },
      { id: 48, category: 'tool', title: 'Local-First Storage Strategy', prompt: "Create a prompt for building a local-first storage strategy for an application. Detail choices between Room, Realm, or other local databases, synchronization mechanisms, and conflict resolution strategies.", icon: '🗃️' },
      { id: 49, category: 'tool', title: 'Performance Optimization Prompt', prompt: "Generate a prompt for performance profiling and optimization of an application. Include steps for identifying bottlenecks (CPU, memory, network), suggesting code improvements, and measuring impact.", icon: '⚡' },
      { id: 50, category: 'tool', title: 'App Launch Checklist', prompt: "Write a prompt producing a full, detailed app launch checklist. Cover pre-launch marketing, app store submission requirements, legal considerations, post-launch monitoring, and maintenance tasks.", icon: '🚦' },
      { id: 51, category: 'app', title: 'Real-time Weather Map', prompt: "Build a dynamic real-time weather map application using the OpenWeatherMap API for data and the Google Maps SDK for interactive visualization. Include features like current conditions, forecasts, and weather alerts.", icon: '🌤️' },
      { id: 52, category: 'app', title: 'Crypto Portfolio Tracker', prompt: "Create a cryptocurrency portfolio tracker with real-time price updates via WebSockets, secure local storage using Room, and features for tracking investments, gains/losses, and historical performance.", icon: '₿' },
      { id: 53, category: 'app', title: 'Minimalist Drawing Pad', prompt: "Design a high-performance vector drawing application with a minimalist interface. Implement custom Canvas rendering in Jetpack Compose, supporting various brushes, layers, and export to SVG/PNG.", icon: '🎨' },
      { id: 54, category: 'app', title: 'Focus Pomodoro Timer', prompt: "Build a Pomodoro timer application with deep system integrations, including notification controls, screen dimming during focus sessions, customizable work/break intervals, and productivity statistics.", icon: '⏱️' },
      { id: 55, category: 'app', title: 'Smart Flashcards', prompt: "Create a spaced-repetition flashcard application (Anki clone) with intelligent scheduling algorithms, multimedia support (images, audio), customizable decks, and progress tracking for effective learning.", icon: '🧠' },
      { id: 56, category: 'app', title: 'Local File Manager', prompt: "Develop a robust local file manager application leveraging Android's Scoped Storage. Include features like file browsing, copying, moving, deleting, sharing, and viewing common file types.", icon: '📂' },
      { id: 57, category: 'app', title: 'Meditation Breathwork', prompt: "Build a meditation and breathwork application with guided sessions, customizable ambient soundscapes, haptic feedback for breathing cues, and progress tracking for mindfulness practice.", icon: '🧘' },
      { id: 58, category: 'app', title: 'E-Commerce Storefront', prompt: "Create a modern e-commerce application with a compelling UI/UX, a robust logic layer for product browsing, cart management, checkout flow, and integration with a mock payment gateway. Focus on user journey.", icon: '🛒' },
      { id: 59, category: 'app', title: 'Encrypted Chat UI', prompt: "Design an end-to-end encrypted chat application interface. Focus on secure message display, user authentication, contact management, and a clean, intuitive messaging experience without backend implementation.", icon: '💬' },
      { id: 60, category: 'app', title: 'Plant Identifier', prompt: "Build a plant care application that uses ML Kit image labeling for plant identification. Include features for care reminders, watering schedules, and a plant encyclopedia with detailed information.", icon: '🌱' },
      { id: 61, category: 'android', title: 'CameraX Implementation', prompt: "Implement a modern CameraX pipeline for an Android application, covering image capture, video recording, preview, and advanced features like HDR, beauty filters, and custom overlays.", icon: '📷' },
      { id: 62, category: 'android', title: 'Bluetooth LE Scanner', prompt: "Create a robust Bluetooth Low Energy (BLE) scanning and connection service for Android. Include device discovery, GATT profile interaction, data reading/writing, and handling connection states.", icon: '📡' },
      { id: 63, category: 'android', title: 'FCM Push Notifications', prompt: "Set up complete Firebase Cloud Messaging (FCM) for an Android application, including token registration, handling incoming messages (data and notification), and displaying rich notifications with actions.", icon: '🔔' },
      { id: 64, category: 'android', title: 'Glance App Widgets', prompt: "Build modern home screen widgets using Jetpack Glance for an Android application. Demonstrate dynamic content updates, user interaction, and efficient data display within widget constraints.", icon: '🧩' },
      { id: 65, category: 'android', title: 'Dynamic Material You', prompt: "Implement complete Material You dynamic theming for an Android application, extracting colors from the user's wallpaper and applying them consistently across all UI components and system elements.", icon: '🎨' },
      { id: 66, category: 'android', title: 'In-App Purchases', prompt: "Integrate the Google Play Billing Library for in-app purchases in an Android application. Cover one-time products, subscriptions, purchase flow, and verification of purchases on a backend (mocked if necessary).", icon: '💳' },
      { id: 67, category: 'android', title: 'Foreground Services', prompt: "Implement a reliable Foreground Service for location tracking or continuous background tasks in an Android application. Ensure proper notification display, lifecycle management, and battery optimization.", icon: '🚗' },
      { id: 68, category: 'android', title: 'Paging 3 Integration', prompt: "Add Paging 3 to an existing RecyclerView or LazyColumn in an Android application. Implement data loading from a network source with pagination, error handling, and refresh mechanisms.", icon: '📑' },
      { id: 69, category: 'android', title: 'App Links & Deep Links', prompt: "Configure Android App Links and Deep Links for an application. Enable seamless navigation from web URLs or other apps directly into specific content within the application, including intent filters and asset links.", icon: '🔗' },
      { id: 70, category: 'android', title: 'Biometric Authentication', prompt: "Implement BiometricPrompt correctly for secure biometric authentication (fingerprint, face) in an Android application. Handle various authentication outcomes and provide clear user feedback.", icon: '🔑' },
      { id: 71, category: 'prompt', title: 'Code Review Bot', prompt: "Act as a strict Senior Android Reviewer. Analyze the provided Kotlin/Java code for best practices, potential bugs, performance issues, architectural flaws, and suggest idiomatic improvements. Provide detailed feedback.", icon: '🧾' },
      { id: 72, category: 'prompt', title: 'Compose Perf Tuning', prompt: "Generate a prompt that analyzes a Jetpack Compose screen for performance bottlenecks. Identify recomposition issues, inefficient modifiers, and suggest optimizations for smoother UI rendering and reduced battery consumption.", icon: '🧠' },
      { id: 73, category: 'prompt', title: 'UI Test Generator', prompt: "Write a prompt to auto-generate comprehensive Espresso and Jetpack Compose UI tests for a given screen or component. Focus on testing user interactions, state changes, and visual correctness across different device configurations.", icon: '🧪' },
      { id: 74, category: 'prompt', title: 'Legacy to Kotlin Flow', prompt: "Create a prompt for migrating RxJava/LiveData codebases to modern Kotlin Flow. Detail the steps for converting observables/streams, handling backpressure, and integrating with ViewModel and Repository layers.", icon: '🌊' },
      { id: 75, category: 'prompt', title: 'Accessibility Audit', prompt: "Design a prompt that scans XML layout files and Jetpack Compose UI code for accessibility issues. Identify missing content descriptions, insufficient contrast, small touch targets, and suggest fixes for WCAG compliance.", icon: '♿' },
      { id: 76, category: 'prompt', title: 'Localization Prep', prompt: "Generate a prompt to extract hardcoded strings and other localizable resources from an Android project. Suggest best practices for internationalization (i18n) and prepare the project for multiple language support.", icon: '🌍' },
      { id: 77, category: 'prompt', title: 'Edge Case Handler', prompt: "Create a prompt that forces the LLM to identify and address edge cases and error conditions for a given feature or code snippet. Ensure robust error handling, graceful degradation, and user-friendly feedback.", icon: '🧨' },
      { id: 78, category: 'prompt', title: 'Gradle to Version Catalogs', prompt: "Write a prompt that converts old build.gradle files using hardcoded dependencies into a modern Gradle Version Catalogs setup. Detail the steps for creating TOML files and updating build scripts.", icon: '📦' },
      { id: 79, category: 'prompt', title: 'CICD Pipeline Builder', prompt: "Generate a prompt to construct a GitHub Actions YAML workflow for an Android project. Include steps for building, testing, linting, and deploying the application to a staging or production environment.", icon: '🚀' },
      { id: 80, category: 'prompt', title: 'MVI State Machine', prompt: "Create a prompt that strictly enforces the Model-View-Intent (MVI) pattern for a given Android feature. Detail the state, intent, and reducer implementations, ensuring a unidirectional data flow and clear state management.", icon: '🧠' },
      { id: 81, category: 'document', title: 'Security Audit Report', prompt: "Draft a comprehensive mobile security audit report template. Include sections for identified vulnerabilities, risk assessment, recommended mitigations, and compliance checks against industry standards.", icon: '📄' },
      { id: 82, category: 'document', title: 'Open Source Guide', prompt: "Create a detailed CONTRIBUTING.md file for an open-source project. Outline guidelines for code contributions, bug reporting, feature requests, pull request process, and code of conduct.", icon: '📖' },
      { id: 83, category: 'document', title: 'API Documentation', prompt: "Generate a comprehensive API integration document for an internal or external API. Include endpoints, request/response formats, authentication methods, error codes, and example usage in multiple languages.", icon: '📚' },
      { id: 84, category: 'document', title: 'User Manual Help Center', prompt: "Write a structured Help Center article suite for an application. Cover getting started guides, feature explanations, troubleshooting common issues, and FAQs. Optimize for searchability and user self-service.", icon: '🧰' },
      { id: 85, category: 'document', title: 'QA Test Plan', prompt: "Draft a comprehensive QA test plan for a software release. Include scope, testing types (functional, performance, security), test environments, entry/exit criteria, and roles/responsibilities.", icon: '🧪' },
      { id: 86, category: 'document', title: 'Sprint Retrospective', prompt: "Create a sprint retrospective document template. Include sections for 'What went well', 'What could be improved', 'Actionable items', and 'Lessons learned' to foster continuous team improvement.", icon: '📝' },
      { id: 87, category: 'document', title: 'Arch Decision Record', prompt: "Write an Architecture Decision Record (ADR) for a significant technical decision. Document the context, decision, alternatives considered, and consequences to maintain architectural consistency and knowledge.", icon: '🧩' },
      { id: 88, category: 'document', title: 'Database ER Diagram', prompt: "Generate an Entity-Relationship (ER) diagram representation for a given database schema. Include entities, attributes, relationships (one-to-one, one-to-many, many-to-many), and primary/foreign keys.", icon: '🗃️' },
      { id: 89, category: 'document', title: 'EULA Draft', prompt: "Draft an End User License Agreement (EULA) for a mobile application. Cover terms of use, intellectual property rights, disclaimers, limitations of liability, and termination conditions. Consult legal counsel for final version.", icon: '📃' },
      { id: 90, category: 'document', title: 'A11y Compliance Statement', prompt: "Write an Accessibility Compliance Statement for a digital product. Detail adherence to accessibility standards (e.g., WCAG), features implemented for accessibility, and ongoing efforts to improve inclusivity.", icon: '♿' },
      { id: 91, category: 'tool', title: 'Git Hook Script', prompt: "Write a pre-commit Git hook script to automate code quality checks. Include linting, formatting, and unit test execution before allowing a commit, ensuring consistent code standards.", icon: '🪝' },
      { id: 92, category: 'tool', title: 'Gradle Build Optimizer', prompt: "Provide a detailed checklist and actionable steps for Android Gradle build optimization. Cover dependency management, build caching, parallel execution, and profiling tools to reduce build times.", icon: '⚙️' },
      { id: 93, category: 'tool', title: 'ProGuard Rules Gen', prompt: "Generate common ProGuard/R8 rules for an Android application. Focus on keeping necessary classes, methods, and fields while obfuscating and optimizing the rest to reduce APK size and improve security.", icon: '🧰' },

    function renderPrompts() {
      const grid = document.getElementById('promptGrid');
      grid.innerHTML = '';
      const searchInput = document.getElementById('searchInput').value.toLowerCase();

      const filteredPrompts = prompts.filter(p => 
        p.title.toLowerCase().includes(searchInput) || 
        p.prompt.toLowerCase().includes(searchInput) ||
        p.category.toLowerCase().includes(searchInput)
      );

      filteredPrompts.forEach(p => {
        const card = document.createElement('div');
        card.className = 'prompt-card';
        card.innerHTML = `
          <h3 class="text-xl font-bold text-white mb-2">${p.icon} ${p.title}</h3>
          <p class="text-sm text-gray-400 mb-6 flex-grow">${p.prompt}</p>
          <div class="flex flex-wrap gap-2 mt-auto">
            <button onclick="copyPrompt('${p.prompt.replace(/\'/g, "\\'")}')" class="neo-btn flex-1 text-xs">Copy</button>
            <button onclick="sendToSandbox('${p.prompt.replace(/\'/g, "\\'")}')" class="neo-btn flex-1 text-xs text-cyan-400">Sandbox</button>
          </div>`;
        grid.appendChild(card);
      });
    }

    function copyPrompt(text) {
      navigator.clipboard.writeText(text);
      showToast('Prompt Copied!');
    }

    function sendToSandbox(text) {
      document.getElementById('aiSandboxBox').value = text;
      showToast('Sent to Sandbox!');
    }

    function launchGeminiApp() { 
      const text = document.getElementById('aiSandboxBox').value; 
      if(text) {
        const encodedText = encodeURIComponent(text);
        // Using a more robust intent URI for broader compatibility
        window.location.href = `intent://send?text=${encodedText}#Intent;action=android.intent.action.SEND;type=text/plain;package=com.google.android.apps.bard;end`; 
      }
    }
    
    function copyAll() { 
      navigator.clipboard.writeText(prompts.map(p => p.prompt).join('\n\n')); 
      showToast('All Prompts Copied!');
    }

    function showToast(message) {
      const t = document.getElementById('toast'); 
      t.innerText = message; 
      t.classList.add('show'); 
      setTimeout(() => t.classList.remove('show'), 2000); 
    }

    // Initial render and search functionality
    document.addEventListener('DOMContentLoaded', () => {
      renderPrompts();
      document.getElementById('searchInput').addEventListener('keyup', renderPrompts);
    });
