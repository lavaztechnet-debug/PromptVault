<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="Lava's Prompt Vault - A curated collection of AI prompts for productivity and creativity">
  <title>Lava's Prompt Vault</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Toast Notification -->
  <div id="toast">Copied to Clipboard!</div>
  
  <!-- Main Container -->
  <div class="max-w-2xl mx-auto">
    <!-- Header -->
    <header class="text-center my-8">
      <h1 class="text-4xl font-black mb-6 text-white tracking-tight">Lava's Prompt Vault</h1>
      <div class="flex flex-wrap gap-2 justify-center">
        <button onclick="copyAll()" class="neo-btn">📋 Copy All</button>
        <button onclick="window.print()" class="neo-btn">🖨️ Print</button>
      </div>
    </header>

    <!-- Vault Tab Content -->
    <div id="vault" class="tab-content active">
      <!-- Search Input -->
      <input type="text" id="searchInput" class="neo-inset" placeholder="🔍 Search prompts..." style="margin-bottom: 12px; width: 100%;">
      
      <!-- Category Filter -->
      <div class="category-filter">
        <span class="cat-badge app active" data-category="app">App</span>
        <span class="cat-badge android" data-category="android">Android</span>
        <span class="cat-badge prompt" data-category="prompt">Prompt</span>
        <span class="cat-badge document" data-category="document">Document</span>
        <span class="cat-badge tool" data-category="tool">Tool</span>
        <span class="cat-badge image-enhancing" data-category="image-enhancing">Visual</span>
        <span class="cat-badge" data-category="all" style="color: #a0a0a0; border-color: #a0a0a0;">All</span>
      </div>
      
      <!-- Prompt Grid -->
      <div id="promptGrid" class="grid grid-cols-1 gap-4" style="margin-top: 16px;"></div>
    </div>

    <!-- Create Tab Content -->
    <div id="create" class="tab-content">
      <div class="neo-container">
        <h2>✨ Create Your Own Prompt</h2>
        
        <!-- Title Input -->
        <div style="margin-top: 16px;">
          <label class="form-label">Title</label>
          <input type="text" id="customTitle" class="neo-inset" placeholder="Enter prompt title...">
        </div>

        <!-- Prompt Textarea -->
        <div style="margin-top: 12px;">
          <label class="form-label">Prompt</label>
          <textarea id="customPrompt" class="neo-inset" placeholder="Enter your custom prompt here..." style="min-height: 120px; resize: vertical;"></textarea>
        </div>

        <!-- Category Select -->
        <div style="margin-top: 12px;">
          <label class="form-label">Category</label>
          <select id="customCategory" class="neo-inset">
            <option value="app">📱 App</option>
            <option value="android">🤖 Android</option>
            <option value="prompt">✍️ Prompt</option>
            <option value="document">📄 Document</option>
            <option value="tool">🛠️ Tool</option>
            <option value="image-enhancing">🎨 Visual</option>
          </select>
        </div>

        <!-- Icon Input -->
        <div style="margin-top: 12px;">
          <label class="form-label">Icon Emoji</label>
          <input type="text" id="customIcon" class="neo-inset" placeholder="Enter emoji icon..." value="✨" maxlength="2">
        </div>

        <!-- Action Buttons -->
        <div class="button-group" style="margin-top: 16px;">
          <button onclick="addCustomPrompt()" class="neo-btn primary" style="flex: 1;">➕ Add to Vault</button>
          <button onclick="clearCustomForm()" class="neo-btn" style="flex: 1;">🔄 Clear</button>
        </div>

        <!-- Custom Prompts List -->
        <div style="margin-top: 24px;">
          <h3 style="margin: 0 0 12px 0; font-size: 1.1rem;">📌 Your Custom Prompts</h3>
          <div id="customPromptsList" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Files -->
  <script src="prompts.js"></script>
  <script src="app.js"></script>
</body>
</html>
