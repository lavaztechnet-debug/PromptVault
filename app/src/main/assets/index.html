    .prompt-card { background:#333; border-radius:16px; padding: 16px; display:flex; flex-direction:column; border: 1px solid #444; }
    #toast { visibility:hidden; position:fixed; bottom:50px; left:50%; transform:translateX(-50%); background:#333; color:#59f0ff; padding:12px 24px; border-radius:25px; z-index:1000; font-weight: bold; border: 1px solid #59f0ff; }
    #toast.show { visibility:visible; }

    function renderPrompts() {
      const grid = document.getElementById('promptGrid');
      grid.innerHTML = '';
      prompts.forEach(p => {
        const card = document.createElement('div');
        card.className = 'prompt-card';
        card.innerHTML = `
          <h3 class="text-xl font-bold text-white mb-2">${p.icon} ${p.title}</h3>
          <p class="text-sm text-gray-400 mb-6 flex-grow">${p.prompt}</p>
          <div class="flex gap-2">
            <button onclick="navigator.clipboard.writeText('${p.prompt.replace(/'/g, "\\'")}')" class="neo-btn flex-1 text-xs">Copy</button>
            <button onclick="document.getElementById('aiSandboxBox').value='${p.prompt.replace(/'/g, "\\'")}'" class="neo-btn flex-1 text-xs text-cyan-400">Sandbox</button>
          </div>`;
        grid.appendChild(card);
      });
    }
    
    function launchGeminiApp() { 
      const text = document.getElementById('aiSandboxBox').value; 
      if(text) window.location.href = `intent:#Intent;action=android.intent.action.SEND;type=text/plain;S.android.intent.extra.TEXT=${encodeURIComponent(text)};package=com.google.android.apps.bard;end`; 
    }
    
    function copyAll() { 
      navigator.clipboard.writeText(prompts.map(p => p.prompt).join('\n\n')); 
      const t = document.getElementById('toast'); 
      t.innerText='All Copied!'; 
      t.classList.add('show'); 
      setTimeout(()=>t.classList.remove('show'), 2000); 
    }
    
    renderPrompts();
  </script>
