<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lava's Expanded Prompt Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg:#1a1a1a; 
      --bg-2:#252525; 
      --bg-3:#2f2f2f;
      --text:#e8e8e8; 
      --muted:#a0a0a0; 
      --glow-cyan:#59f0ff;
      --color-app:#6366f1;
      --color-android:#34d399;
      --color-prompt:#f59e0b;
      --color-document:#8b5cf6;
      --color-tool:#ec4899;
      --color-image:#06b6d4;
    }
    
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    
    body { 
      margin: 0; 
      min-height: 100vh; 
      font-family: 'Outfit', sans-serif; 
      background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 50%, #1a1a1a 100%); 
      color: var(--text); 
      padding: 0;
      overflow-x: hidden;
    }

    /* Tab Navigation */
    .tab-nav {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding: 12px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: linear-gradient(145deg, #3a3a3a, #242424);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 4px 8px rgba(0,0,0,0.6);
      border-radius: 12px;
      padding: 10px 16px;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.85rem;
    }

    .tab-btn.active {
      background: linear-gradient(145deg, var(--glow-cyan), #0a9db5);
      border-color: var(--glow-cyan);
      color: #1a1a1a;
      box-shadow: 0 8px 16px rgba(89, 240, 255, 0.3);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Enhanced Neumorphic Styles with 3D Depth */
    .neo-container {
      background: linear-gradient(145deg, #353535, #1f1f1f);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 
        0 20px 40px rgba(0,0,0,0.9),
        0 10px 20px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.1),
        inset 0 -1px 0 rgba(0,0,0,0.8);
      border-radius: 24px;
      padding: 24px;
      position: relative;
    }

    .neo-container::before {
      content: '';
      position: absolute;
      inset: 1px;
      border-radius: 23px;
      background: linear-gradient(145deg, rgba(255,255,255,0.02) 0%, transparent 50%);
      pointer-events: none;
    }

    .neo-btn {
      background: linear-gradient(145deg, #3a3a3a, #242424);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 
        0 12px 24px rgba(0,0,0,0.8),
        0 6px 12px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.15),
        inset 0 -1px 0 rgba(0,0,0,0.7);
      border-radius: 18px;
      padding: 14px 20px;
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .neo-btn::before {
      content: '';
      position: absolute;
      inset: 1px;
      border-radius: 17px;
      background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    .neo-btn:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 16px 32px rgba(0,0,0,0.9),
        0 8px 16px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.2),
        inset 0 -1px 0 rgba(0,0,0,0.8);
    }

    .neo-btn:active {
      transform: translateY(1px);
      box-shadow: 
        0 8px 16px rgba(0,0,0,0.8),
        0 4px 8px rgba(0,0,0,0.6),
        inset 0 2px 4px rgba(0,0,0,0.7);
    }

    .neo-inset {
      background: linear-gradient(145deg, #1a1a1a, #141414);
      border: 1px solid rgba(0,0,0,0.6);
      box-shadow: 
        inset 0 4px 12px rgba(0,0,0,0.8),
        inset 0 -2px 4px rgba(255,255,255,0.08),
        0 2px 4px rgba(0,0,0,0.6);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .neo-inset:focus {
      outline: none;
      border-color: rgba(89, 240, 255, 0.4);
      box-shadow: 
        inset 0 4px 12px rgba(0,0,0,0.8),
        inset 0 -2px 4px rgba(255,255,255,0.1),
        0 0 16px rgba(89, 240, 255, 0.2);
    }

    /* Category Colors */
    .prompt-card {
      background: linear-gradient(135deg, #2d2d2d, #222222);
      border-left: 4px solid var(--card-color, #6366f1);
      box-shadow: 
        0 16px 32px rgba(0,0,0,0.85),
        0 8px 16px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      transition: all 0.3s ease;
      transform: translateZ(0);
    }

    .prompt-card.cat-app { --card-color: var(--color-app); }
    .prompt-card.cat-android { --card-color: var(--color-android); }
    .prompt-card.cat-prompt { --card-color: var(--color-prompt); }
    .prompt-card.cat-document { --card-color: var(--color-document); }
    .prompt-card.cat-tool { --card-color: var(--color-tool); }
    .prompt-card.cat-image-enhancing { --card-color: var(--color-image); }

    .prompt-card::before {
      content: '';
      position: absolute;
      inset: 1px;
      border-radius: 19px;
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 50%);
      pointer-events: none;
    }

    .prompt-card:active {
      transform: scale(0.98);
      box-shadow: 
        0 12px 24px rgba(0,0,0,0.85),
        0 6px 12px rgba(0,0,0,0.6),
        inset 0 2px 4px rgba(0,0,0,0.7);
    }

    .prompt-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .prompt-number {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
      background: var(--card-color, #6366f1);
      border-radius: 8px;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .prompt-icon {
      font-size: 1.5rem;
      min-width: 30px;
      text-align: center;
    }

    .prompt-card h3 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      margin: 0;
      word-break: break-word;
      flex: 1;
    }

    .prompt-card p {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    #toast {
      visibility: hidden;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(145deg, #3a3a3a, #242424);
      border: 1px solid rgba(89, 240, 255, 0.4);
      color: var(--glow-cyan);
      padding: 14px 28px;
      border-radius: 28px;
      z-index: 1000;
      font-weight: 600;
      box-shadow: 
        0 12px 32px rgba(89, 240, 255, 0.3),
        0 6px 16px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(89, 240, 255, 0.2);
      animation: toastSlide 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #toast.show {
      visibility: visible;
    }

    @keyframes toastSlide {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    header {
      padding: 12px 0;
      margin-bottom: 8px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 900;
      margin: 0 0 12px 0;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 0%, #a0a0a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .button-group .neo-btn {
      flex: 1;
      min-width: 100px;
      font-size: 0.85rem;
      padding: 12px 14px;
    }

    .category-filter {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 12px 0;
    }

    .cat-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid;
      transition: all 0.3s ease;
      background: rgba(0,0,0,0.3);
    }

    .cat-badge.app { border-color: var(--color-app); color: var(--color-app); }
    .cat-badge.android { border-color: var(--color-android); color: var(--color-android); }
    .cat-badge.prompt { border-color: var(--color-prompt); color: var(--color-prompt); }
    .cat-badge.document { border-color: var(--color-document); color: var(--color-document); }
    .cat-badge.tool { border-color: var(--color-tool); color: var(--color-tool); }
    .cat-badge.image-enhancing { border-color: var(--color-image); color: var(--color-image); }

    .cat-badge.active {
      background: currentColor;
      color: white;
    }

    /* Portrait Mode (Mobile Default) */
    @media (max-width: 768px) and (orientation: portrait) {
      body {
        padding-bottom: 20px;
      }

      .max-w-2xl {
        max-width: 100%;
        margin: 0 auto;
        padding: 12px;
      }

      header {
        padding: 16px 0 8px 0;
      }

      header h1 {
        font-size: 1.75rem;
        margin-bottom: 16px;
      }

      .neo-container {
        padding: 18px;
        margin-bottom: 16px;
        border-radius: 20px;
      }

      .neo-container h2 {
        font-size: 1.3rem;
        margin: 0 0 12px 0;
      }

      .neo-inset {
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 12px;
        font-size: 0.9rem;
      }

      textarea.neo-inset {
        min-height: 100px;
        resize: vertical;
        max-height: 180px;
      }

      #searchInput {
        margin-bottom: 16px;
      }

      #promptGrid {
        gap: 12px;
      }

      .prompt-card {
        padding: 16px;
        border-radius: 18px;
        gap: 10px;
      }

      .prompt-card-header {
        gap: 8px;
      }

      .prompt-icon {
        font-size: 1.3rem;
        min-width: 28px;
      }

      .prompt-card h3 {
        font-size: 1.05rem;
      }

      .prompt-card p {
        font-size: 0.8rem;
        -webkit-line-clamp: 2;
      }

      .button-group {
        gap: 8px;
      }

      .button-group .neo-btn {
        font-size: 0.8rem;
        padding: 10px 12px;
        min-width: auto;
      }

      .tab-nav {
        gap: 8px;
        padding: 8px;
      }

      .tab-btn {
        padding: 8px 12px;
        font-size: 0.75rem;
      }
    }

    /* Landscape Mode */
    @media (max-width: 1024px) and (orientation: landscape) {
      body {
        padding-bottom: 12px;
      }

      .max-w-2xl {
        max-width: 100%;
        padding: 10px;
      }

      header {
        padding: 8px 0;
        margin-bottom: 4px;
      }

      header h1 {
        font-size: 1.5rem;
        margin-bottom: 8px;
      }

      .button-group {
        gap: 6px;
        margin-bottom: 12px;
      }

      .button-group .neo-btn {
        font-size: 0.75rem;
        padding: 10px 12px;
        min-width: 70px;
      }

      #promptGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 12px;
      }

      .prompt-card {
        padding: 14px;
        gap: 8px;
      }

      .prompt-icon {
        font-size: 1.2rem;
      }

      .prompt-card h3 {
        font-size: 1rem;
      }

      .prompt-card p {
        font-size: 0.75rem;
        -webkit-line-clamp: 2;
      }
    }

    /* Tablet/Larger screens */
    @media (min-width: 769px) {
      .max-w-2xl {
        max-width: 900px;
        padding: 0 16px;
      }

      header h1 {
        font-size: 2.25rem;
      }

      #promptGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }

      .button-group .neo-btn {
        font-size: 0.9rem;
        padding: 12px 18px;
      }
    }

    /* Prevent layout shift on scroll */
    html {
      overflow-y: scroll;
    }

    * {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body>
  <div id="toast">Copied to Clipboard!</div>
  
  <div class="max-w-2xl mx-auto">
    <header class="text-center">
      <h1>🔮 Lava's Prompt Vault</h1>
      <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('vault')">📚 Vault</button>
        <button class="tab-btn" onclick="switchTab('create')">✏️ Create</button>
      </div>
    </header>

    <!-- Vault Tab -->
    <div id="vault" class="tab-content active">
      <div class="button-group" style="margin-bottom: 16px;">
        <button onclick="copyAll()" class="neo-btn">📋 Copy All</button>
        <button onclick="exportGoogleDocs()" class="neo-btn">💙 Docs</button>
        <button onclick="exportSamsungNotes()" class="neo-btn">🧡 Notes</button>
        <button onclick="window.print()" class="neo-btn">🖨️ Print</button>
      </div>

      <input type="text" id="searchInput" class="neo-inset" placeholder="🔍 Search prompts...">
      
      <div class="category-filter">
        <span class="cat-badge app active" onclick="filterByCategory('app')">App</span>
        <span class="cat-badge android" onclick="filterByCategory('android')">Android</span>
        <span class="cat-badge prompt" onclick="filterByCategory('prompt')">Prompt</span>
        <span class="cat-badge document" onclick="filterByCategory('document')">Document</span>
        <span class="cat-badge tool" onclick="filterByCategory('tool')">Tool</span>
        <span class="cat-badge image-enhancing" onclick="filterByCategory('image-enhancing')">Visual</span>
        <span class="cat-badge" onclick="filterByCategory('all')" style="color: #a0a0a0; border-color: #a0a0a0;">All</span>
      </div>
      
      <div id="promptGrid" class="grid grid-cols-1 gap-4"></div>
    </div>

    <!-- Create Tab -->
    <div id="create" class="tab-content">
      <div class="neo-container">
        <h2>✨ Create Your Own Prompt</h2>
        
        <label style="display: block; margin-top: 16px; margin-bottom: 8px; font-weight: 600; color: var(--text);">Title</label>
        <input type="text" id="customTitle" class="neo-inset" placeholder="Enter prompt title..." style="margin-bottom: 12px;">

        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text);">Prompt</label>
        <textarea id="customPrompt" class="neo-inset" placeholder="Enter your custom prompt here..." style="min-height: 120px; margin-bottom: 12px; resize: vertical;"></textarea>

        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text);">Category</label>
        <select id="customCategory" class="neo-inset" style="margin-bottom: 12px;">
          <option value="app">📱 App</option>
          <option value="android">🤖 Android</option>
          <option value="prompt">✍️ Prompt</option>
          <option value="document">📄 Document</option>
          <option value="tool">🛠️ Tool</option>
          <option value="image-enhancing">🎨 Visual</option>
        </select>

        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text);">Icon Emoji</label>
        <input type="text" id="customIcon" class="neo-inset" placeholder="Enter emoji icon..." value="✨" maxlength="2" style="margin-bottom: 16px;">

        <div class="button-group">
          <button onclick="addCustomPrompt()" class="neo-btn primary" style="flex: 1;">➕ Add to Vault</button>
          <button onclick="clearCustomForm()" class="neo-btn" style="flex: 1;">🔄 Clear</button>
        </div>

        <div style="margin-top: 24px;">
          <h3 style="margin: 0 0 12px 0; font-size: 1.1rem;">📌 Your Custom Prompts</h3>
          <div id="customPromptsList" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Category color mapping
    const categoryIcons = {
      'app': '📱',
      'android': '🤖',
      'prompt': '✍️',
      'document': '📄',
      'tool': '🛠️',
      'image-enhancing': '🎨'
    };

    const basePrompts = [
      { id: 1, category: 'app', icon: '📝', title: 'Offline-First Note App', prompt: "Build a complete offline-first note app with robust search capabilities, tagging, seamless cloud synchronization, and flexible storage options. Include real-time sync, conflict resolution, and end-to-end encryption." },
      { id: 2, category: 'app', icon: '🎙️', title: 'Premium Podcast Player', prompt: "Create a premium podcast player featuring advanced playlist management, an intelligent sleep timer, precise chapter markers, variable playback speeds, and queue management. Include downloading for offline listening." },
      { id: 3, category: 'app', icon: '👻', title: 'Horror Story Reader', prompt: "Design an immersive horror story reader app with chilling audio narration, atmospheric visual effects (e.g., subtle parallax, dynamic shadows), and interactive story branching with multiple endings." },
      { id: 4, category: 'app', icon: '🔐', title: 'Secure Password Vault', prompt: "Build a highly secure password vault app incorporating biometric authentication (fingerprint/face ID), military-grade encryption, password generation, and secure sharing with expiration options." },
      { id: 5, category: 'app', icon: '🎯', title: 'Habit Tracker Pro', prompt: "Create a professional habit tracker with advanced streak tracking, customizable reminders, detailed analytics and progress visualization, habit linking, and motivation notifications." },
      { id: 6, category: 'image-enhancing', icon: '🎨', title: 'Neumorphic UI Design', prompt: "Design a neumorphic UI mockup with soft, extruded shapes, subtle shadows, and tactile elements. Focus on soft light sources, minimal color, and realistic material finishes that appear to be pushed or pulled from the surface." },
      { id: 7, category: 'image-enhancing', icon: '🧊', title: 'Glassmorphism Effect', prompt: "Create a glassmorphism design with frosted glass effects, translucency, vibrant colors, and layered elements. Include proper backdrop blur, transparency variations, and realistic light refraction for a premium, modern aesthetic." },
      { id: 8, category: 'image-enhancing', icon: '🌐', title: '3D Depth Rendering', prompt: "Render a 3D depth scene with proper perspective, realistic lighting, accurate shadows, and material properties. Include depth-of-field effects, proper ambient occlusion, and believable spatial relationships between objects." },
      { id: 9, category: 'image-enhancing', icon: '💎', title: 'Premium 3D Material', prompt: "Create premium 3D materials with realistic reflections, refractions, roughness, and metallic properties. Focus on physically-based rendering, proper light interaction, and luxury material finishes (chrome, glass, carbon fiber, leather)." },
      { id: 10, category: 'image-enhancing', icon: '✨', title: 'Luminous 3D Scene', prompt: "Design a luminous 3D scene with glowing elements, sophisticated lighting design, bloom effects, and atmospheric lighting. Include proper light falloff, color temperature variation, and realistic light bouncing." },
      { id: 11, category: 'app', icon: '📺', title: 'Media Planner', prompt: "Build a comprehensive media planner app for content creators, including scriptwriting tools, storyboard creation, publishing calendars, asset management, and collaboration features." },
      { id: 12, category: 'app', icon: '💰', title: 'Expense Tracker', prompt: "Create a fully operational expense tracker with OCR receipt scanning, intelligent categorization, detailed charts and financial reports, budget monitoring, and multi-currency support." },
      { id: 13, category: 'app', icon: '📚', title: 'Book Catalog', prompt: "Build a smart book catalog app with ISBN barcode scanning, automatic metadata retrieval (author, genre, publication date), personalized recommendations, and reading progress tracking." },
      { id: 14, category: 'image-enhancing', icon: '🎭', title: 'Surreal 3D Composition', prompt: "Create a surreal 3D composition with impossible geometry, dramatic lighting, and mind-bending spatial relationships. Use creative camera angles, exaggerated proportions, and cinematic composition for maximum impact." },
      { id: 15, category: 'image-enhancing', icon: '🏛️', title: 'Architectural Visualization', prompt: "Render architectural visualization with accurate perspective, realistic materials, proper lighting, and immersive environments. Include detailed textures, appropriate shadows, and believable interior/exterior spaces." },
      { id: 16, category: 'android', icon: '🏗️', title: 'Clean Architecture Refactor', prompt: "Refactor an existing Android application into a modern clean architecture using Jetpack Compose for UI, Hilt for dependency injection, and proper separation of concerns." },
      { id: 17, category: 'android', icon: '🔄', title: 'Fragment to Compose Migration', prompt: "Transform a legacy fragment-based Android application into a modern, declarative Jetpack Compose application, ensuring all features are preserved and tests are updated." },
      { id: 18, category: 'android', icon: '💾', title: 'Offline Caching & Retry Logic', prompt: "Implement comprehensive offline caching and resilient retry logic within the Android repository layer, ensuring data consistency and graceful degradation." },
      { id: 19, category: 'android', icon: '🗄️', title: 'Room Schema Definition', prompt: "Write a complete Room database schema for an application's data model, including detailed Entity definitions, Data Access Objects (DAOs), and migration strategies." },
      { id: 20, category: 'android', icon: '🧠', title: 'ViewModels for All Screens', prompt: "Generate robust ViewModels for all application screens, incorporating loading, empty, and error states, along with appropriate data handling and lifecycle management." },
      { id: 21, category: 'prompt', icon: '✍️', title: 'Production Gemini Prompt', prompt: "Rewrite this high-level idea into a production-grade Gemini prompt. The prompt should be highly specific, structured with clear sections, and include examples." },
      { id: 22, category: 'prompt', icon: '📋', title: 'One-line to Build Spec', prompt: "Expand this one-line application concept into a complete build specification document. Include detailed sections on features, architecture, tech stack, and deployment." },
      { id: 23, category: 'prompt', icon: '✂️', title: 'Features to Tasks', prompt: "Convert a given feature list into a detailed breakdown of implementation tasks, including estimated effort, dependencies, and acceptance criteria." },
      { id: 24, category: 'prompt', icon: '💻', title: 'Force Complete Code', prompt: "Generate a developer prompt that explicitly forces the AI to produce complete, runnable, and non-placeholder code for all requirements without shortcuts." },
      { id: 25, category: 'document', icon: '📄', title: 'Project Brief', prompt: "Write a polished project brief for this application. Include an executive summary, a clear problem statement, proposed solution, and success criteria." },
      { id: 26, category: 'document', icon: '📋', title: 'PRD Document', prompt: "Turn a product idea into a comprehensive Product Requirements Document (PRD). Detail user stories, acceptance criteria, and functional requirements." },
      { id: 27, category: 'document', icon: '🏛️', title: 'Technical Spec', prompt: "Create a detailed technical specification for an entire Android application. Include an architecture diagram, component breakdown, and API specifications." },
      { id: 28, category: 'tool', icon: '🧪', title: 'Test Case Generator', prompt: "Build a prompt that generates detailed test cases from application requirements or user stories. Include test steps, expected results, and edge cases." },
      { id: 29, category: 'tool', icon: '🔍', title: 'Code Audit Prompt', prompt: "Create a prompt for auditing code for potential bugs, missing features, security vulnerabilities, performance bottlenecks, and architectural issues." },
      { id: 30, category: 'tool', icon: '🎨', title: 'UI Refactor Prompt', prompt: "Generate a prompt for refactoring an existing UI into reusable, modular components. Focus on identifying common patterns and extracting them." }
    ];

    let allPrompts = [...basePrompts];
    let displayNumber = basePrompts.length;
    let currentFilter = 'all';

    function renderPrompts() {
      const grid = document.getElementById('promptGrid');
      grid.innerHTML = '';
      const searchInput = document.getElementById('searchInput').value.toLowerCase();

      const filteredPrompts = allPrompts.filter(p => {
        const matchesSearch = p.title.toLowerCase().includes(searchInput) || 
                             p.prompt.toLowerCase().includes(searchInput);
        const matchesCategory = currentFilter === 'all' || p.category === currentFilter;
        return matchesSearch && matchesCategory;
      });

      filteredPrompts.forEach((p, index) => {
        const card = document.createElement('div');
        card.className = `prompt-card cat-${p.category}`;
        card.innerHTML = `
          <div class="prompt-card-header">
            <div class="prompt-number">${index + 1}</div>
            <span class="prompt-icon">${p.icon}</span>
            <h3>${p.title}</h3>
          </div>
          <p>${p.prompt}</p>
          <div class="button-group">
            <button onclick="copyPrompt('${p.prompt.replace(/\'/g, "\\'")}')" class="neo-btn" style="flex:1">Copy</button>
          </div>`;
        grid.appendChild(card);
      });

      if (filteredPrompts.length === 0) {
        grid.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--muted); font-size: 0.95rem;">No prompts found</div>';
      }
    }

    function filterByCategory(category) {
      currentFilter = category;
      document.querySelectorAll('.cat-badge').forEach(badge => {
        badge.classList.remove('active');
      });
      if (category === 'all') {
        document.querySelectorAll('.cat-badge')[6].classList.add('active');
      } else {
        event.target.classList.add('active');
      }
      renderPrompts();
    }

    function copyPrompt(text) {
      navigator.clipboard.writeText(text);
      showToast('Prompt Copied!');
    }

    function copyAll() { 
      const filteredPrompts = allPrompts.filter(p => currentFilter === 'all' || p.category === currentFilter);
      navigator.clipboard.writeText(filteredPrompts.map(p => p.prompt).join('\n\n')); 
      showToast('All Prompts Copied!');
    }

    function showToast(message) {
      const t = document.getElementById('toast'); 
      t.innerText = message; 
      t.classList.add('show'); 
      setTimeout(() => t.classList.remove('show'), 2000); 
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
      if (tab === 'vault') renderPrompts();
    }

    function addCustomPrompt() {
      const title = document.getElementById('customTitle').value.trim();
      const prompt = document.getElementById('customPrompt').value.trim();
      const category = document.getElementById('customCategory').value;
      const icon = document.getElementById('customIcon').value.trim() || '✨';

      if (!title || !prompt) {
        showToast('Please fill in title and prompt');
        return;
      }

      displayNumber++;
      allPrompts.push({
        id: Date.now(),
        category,
        icon,
        title,
        prompt
      });

      renderCustomPromptsList();
      clearCustomForm();
      showToast('Prompt added successfully!');
    }

    function renderCustomPromptsList() {
      const list = document.getElementById('customPromptsList');
      const customPrompts = allPrompts.filter(p => !basePrompts.find(bp => bp.id === p.id));
      
      list.innerHTML = customPrompts.length === 0 ? 
        '<div style="color: var(--muted); font-size: 0.9rem; text-align: center; padding: 20px;">No custom prompts yet</div>' : 
        customPrompts.map((p, i) => `
          <div class="prompt-card cat-${p.category}" style="gap: 8px; padding: 12px;">
            <div class="prompt-card-header" style="gap: 8px;">
              <span class="prompt-icon">${p.icon}</span>
              <h3 style="font-size: 1rem;">${p.title}</h3>
              <button onclick="deleteCustomPrompt(${p.id})" class="neo-btn" style="padding: 6px 10px; font-size: 0.75rem; min-width: auto;">❌</button>
            </div>
            <p style="font-size: 0.75rem; -webkit-line-clamp: 2;">${p.prompt}</p>
          </div>
        `).join('');
    }

    function deleteCustomPrompt(id) {
      allPrompts = allPrompts.filter(p => p.id !== id);
      renderCustomPromptsList();
      showToast('Prompt deleted');
    }

    function clearCustomForm() {
      document.getElementById('customTitle').value = '';
      document.getElementById('customPrompt').value = '';
      document.getElementById('customCategory').value = 'app';
      document.getElementById('customIcon').value = '✨';
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderPrompts();
      document.getElementById('searchInput').addEventListener('keyup', renderPrompts);
    });

    function exportGoogleDocs() {
      alert('Export to Google Docs functionality coming soon!');
    }

    function exportSamsungNotes() {
      alert('Export to Samsung Notes functionality coming soon!');
    }
  </script>
</body>
</html>
