<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#e0e5ec" id="themeColorMeta">
  <title>Lava's Prompt Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast">Action Successful!</div>

  <div class="max-w-6xl mx-auto p-4">
    <header class="text-center my-8" style="position: relative;">
      <button onclick="toggleTheme()" class="neo-btn" style="position: absolute; right: 0; top: 0; padding: 12px; border-radius: 50%; width: 48px; height: 48px;" id="themeToggleBtn">🌙</button>
      <h1 class="text-4xl mb-8 tracking-tight font-extrabold">Lava's Vault</h1>
      
      <div class="tab-nav max-w-2xl mx-auto">
        <button class="tab-btn active" data-tab="vault">📂 Vault</button>
        <button class="tab-btn" data-tab="notepad">📝 Notes</button>
      </div>
    </header>

    <div id="vault" class="tab-content active">
      <div class="flex flex-col md:flex-row gap-4 mb-8 items-center">
        <div class="flex gap-4 w-full md:w-auto flex-1">
          <input type="text" id="searchInput" class="neo-inset" placeholder="🔍 Search prompts..." style="flex: 1;">
        </div>
        
        <div class="flex gap-2 items-center bg-base p-2 rounded-2xl neo-inset-mini">
          <button onclick="changeLayout('list')" class="layout-btn p-2 rounded-xl" title="List View">📄</button>
          <button onclick="changeLayout('grid-2')" class="layout-btn p-2 rounded-xl active" title="2 Column Grid">👥</button>
          <button onclick="changeLayout('grid-4')" class="layout-btn p-2 rounded-xl" title="4 Column Grid">⣿</button>
        </div>

        <div class="flex gap-2">
          <button onclick="exportToHTML()" class="neo-btn primary" title="Export all prompts as HTML">
            <span>🌐</span> Export
          </button>
          <button onclick="copyAllPrompts()" class="neo-btn" title="Copy All Prompts">
            <span>📋</span> All
          </button>
        </div>
      </div>
      
      <div id="promptGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6 layout-grid-2">
        <!-- Prompts will be rendered here -->
      </div>
    </div>

    <div id="notepad" class="tab-content">
      <div class="neo-container max-w-2xl mx-auto">
        <h2 class="text-2xl mb-6 flex items-center gap-3">
          <span>📝</span> Quick Note
        </h2>
        <textarea id="noteEditor" class="neo-inset mb-6" placeholder="Capture your thoughts or custom prompts here..." style="min-height: 400px; resize: vertical;"></textarea>
        <button onclick="saveNoteManually()" class="neo-btn primary w-full">
          <span>💾</span> Save Note
        </button>
      </div>
    </div>
  </div>

  <!-- Load data first, then app logic -->
  <script src="prompts.js"></script>
  <script src="app.js"></script>
</body>
</html>
