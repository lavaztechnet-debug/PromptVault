<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#e0e5ec" id="themeColorMeta">
  <title>Lava's Prompt Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast">Action Successful!</div>

  <div class="max-w-2xl mx-auto p-4">
    <header class="text-center my-8" style="position: relative;">
      <button onclick="toggleTheme()" class="neo-btn" style="position: absolute; right: 0; top: 0; padding: 10px; border-radius: 50%;" id="themeToggleBtn">🌙</button>
      <h1 class="text-3xl mb-6 tracking-tight">Lava's Vault</h1>
      
      <div class="tab-nav">
        <button class="tab-btn active" data-tab="vault">📚 Vault</button>
        <button class="tab-btn" data-tab="notepad">📝 Notes</button>
        <button class="tab-btn" data-tab="create">✏️ Add</button>
      </div>
    </header>

    <div id="vault" class="tab-content active">
      <input type="text" id="searchInput" class="neo-inset" placeholder="🔍 Search prompts..." style="margin-bottom: 16px; width: 100%;">
      <div id="promptGrid" class="grid grid-cols-1 gap-5"></div>
    </div>

    <div id="notepad" class="tab-content">
      <div class="neo-container">
        <h2 class="mb-4">📝 Quick Note</h2>
        <textarea id="noteEditor" class="neo-inset" placeholder="Write your thoughts here... saved automatically." style="min-height: 300px;"></textarea>
      </div>
    </div>

    <div id="create" class="tab-content">
      <div class="neo-container">
        <h2>✨ Add Prompt</h2>
        <input type="text" id="customTitle" class="neo-inset" placeholder="Title" style="margin-top:20px;">
        <textarea id="customPrompt" class="neo-inset" placeholder="Prompt text..." style="min-height: 100px; margin-top:12px;"></textarea>
        <button onclick="addCustomPrompt()" class="neo-btn primary w-full mt-4">➕ Add to Vault</button>
      </div>
    </div>
  </div>

  <script src="prompts.js"></script>
  <script src="app.js"></script>
</body>
</html>
